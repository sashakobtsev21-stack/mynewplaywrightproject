name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep only the latest run per ref (matches tests.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config (.gitleaks.toml at the repo root) allowlists the intentional
          # fake credentials in test fixtures so the scan has no false positives.
