name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Save CI minutes on noisy branches: only keep the latest run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Offline AI evals as a release gate: scores the committed fixtures against
      # evals/thresholds.json and fails the build if the bar isn't cleared. No key,
      # so it's deterministic; the LLM judge only runs in live (keyed) runs.
      - name: AI evals (offline gate)
        run: npm run eval:ai

  smoke:
    name: smoke (chromium)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-smoke-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browsers + deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run smoke
        run: npm run test:smoke -- --project=chromium
        env:
          CI: '1'
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-allure
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

  regression:
    name: regression (${{ matrix.project }})
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, api]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        if: matrix.project != 'api'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browsers + deps)
        if: matrix.project != 'api' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install system deps only (cache hit)
        if: matrix.project != 'api' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      - name: Run regression
        run: npx playwright test --project=${{ matrix.project }} tests/regression
        env:
          CI: '1'
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-${{ matrix.project }}-allure
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces / screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: regression-${{ matrix.project }}-debug
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: visual (chromium)
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-visual-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browsers + deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Gating. Baselines are committed for the linux/chromium platform only and are
      # regenerated by .github/workflows/update-snapshots.yml, never by this job:
      # a job that writes its own expectation cannot fail.
      - name: Run visual regression
        run: npx playwright test --project=chromium tests/visual
        env:
          CI: '1'
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}

      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-debug
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    name: perf (chromium, non-gating)
    needs: regression
    runs-on: ubuntu-latest
    # NOT a gate. These budgets are measured against a shared public demo on
    # infrastructure we do not control, so a red here means "the demo was slow
    # today", not "this change regressed performance". The samples are still
    # collected and published; only the verdict is advisory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-perf-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (browsers + deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run performance samples
        run: npx playwright test --project=chromium tests/performance
        env:
          CI: '1'

      - name: Upload perf samples
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-samples
          path: |
            perf-samples.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore
