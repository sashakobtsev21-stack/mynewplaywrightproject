# Regenerates visual baselines on the same platform CI compares against.
#
# Why this exists as its own manual workflow: baselines produced on a developer's
# macOS render differently from linux/chromium in CI, so a locally generated PNG
# can never match. Letting the gating job self-update instead would be worse — a
# job that writes its own expectation cannot fail. So updating is a deliberate,
# human-triggered act, and its diff is reviewable like any other change.
name: update visual baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are the baselines being updated?'
        required: true
        default: 'Regenerate linux/chromium baselines'

permissions:
  contents: write

jobs:
  update:
    name: regenerate + commit baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npx playwright test --project=chromium tests/visual --update-snapshots
        env:
          CI: '1'
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'password' }}

      - name: Commit baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 'tests/**/*-snapshots/**'
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "test(visual): regenerate linux/chromium baselines

          Reason: ${{ inputs.reason }}
          Generated by .github/workflows/update-snapshots.yml on ubuntu-latest,
          the same platform the gating visual job compares against."
          git push
